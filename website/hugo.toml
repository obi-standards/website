baseURL = 'https://obistandards.org/'
languageCode = 'en-us'
title = 'Open Blockchain Intelligence Standards'
theme = 'hugo-book'

# OBIS is a standards body; default to permissive indexing.
enableRobotsTXT = true
enableGitInfo = false

[params]
  BookTheme = 'auto'
  BookToC = true
  BookLogo = ''
  BookSection = 'standards'
  BookRepo = 'https://github.com/obi-standards/docs'
  BookEditPath = 'edit/main/content'
  BookSearch = false
  BookComments = false
  BookPortableLinks = true
  BookServiceWorker = false
  description = 'An open community effort developing vendor-neutral standards for blockchain intelligence.'

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[menu]
  [[menu.before]]
    name = 'About'
    url = '/#about'
    weight = 10
